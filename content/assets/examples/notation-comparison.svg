<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">原创四拍短句的五线谱、简谱与TAB对照</title>
  <desc id="desc">四个四分音符，实响G3 C4 D4 E4。高音谱表写G4 C5 D5 E5，吉他低八度实响。简谱1=C且无点1=C4：下点5、1、2、3。TAB依次为3弦0品、2弦1品、2弦3品、1弦0品。</desc>
  <rect width="900" height="590" fill="#fff"/>
  <g font-family="sans-serif" fill="#202020">
    <text x="28" y="34" font-size="22">同一个声音，三种记法 · 4/4 · 每音四分时值</text>
    <text x="28" y="67" font-size="17">五线谱：高音谱表（第二线G4），吉他低八度实响</text>
    <g stroke="#555" stroke-width="1.5">
      <line x1="155" y1="100" x2="850" y2="100"/><line x1="155" y1="120" x2="850" y2="120"/>
      <line x1="155" y1="140" x2="850" y2="140"/><line x1="155" y1="160" x2="850" y2="160"/>
      <line x1="155" y1="180" x2="850" y2="180"/><line x1="155" y1="100" x2="155" y2="180"/>
      <line x1="850" y1="100" x2="850" y2="180"/>
    </g>
    <g font-size="14" text-anchor="end"><text x="142" y="105">F5</text><text x="142" y="125">D5</text><text x="142" y="145">B4</text><text x="142" y="165">G4</text><text x="142" y="185">E4</text></g>
    <g fill="#202020" stroke="#202020" stroke-width="2">
      <circle cx="240" cy="160" r="7"/><line x1="247" y1="160" x2="247" y2="116"/>
      <circle cx="420" cy="130" r="7"/><line x1="413" y1="130" x2="413" y2="174"/>
      <circle cx="600" cy="120" r="7"/><line x1="593" y1="120" x2="593" y2="164"/>
      <circle cx="780" cy="110" r="7"/><line x1="773" y1="110" x2="773" y2="154"/>
    </g>
    <g font-size="17" text-anchor="middle"><text x="240" y="210">谱面 G4</text><text x="420" y="210">谱面 C5</text><text x="600" y="210">谱面 D5</text><text x="780" y="210">谱面 E5</text></g>
    <text x="28" y="256" font-size="17">简谱：1=C，无点1=C4</text>
    <g font-size="29" text-anchor="middle"><text x="240" y="298">5</text><text x="420" y="298">1</text><text x="600" y="298">2</text><text x="780" y="298">3</text></g>
    <circle cx="240" cy="309" r="3"/>
    <text x="28" y="353" font-size="17">TAB：上方1弦，下方6弦；数字为品号</text>
    <g stroke="#777" stroke-width="1.5">
      <line x1="155" y1="380" x2="850" y2="380"/><line x1="155" y1="400" x2="850" y2="400"/>
      <line x1="155" y1="420" x2="850" y2="420"/><line x1="155" y1="440" x2="850" y2="440"/>
      <line x1="155" y1="460" x2="850" y2="460"/><line x1="155" y1="480" x2="850" y2="480"/>
      <line x1="155" y1="380" x2="155" y2="480"/><line x1="850" y1="380" x2="850" y2="480"/>
    </g>
    <g font-size="15" text-anchor="end"><text x="142" y="385">1弦 E4</text><text x="142" y="405">2弦 B3</text><text x="142" y="425">3弦 G3</text><text x="142" y="445">4弦 D3</text><text x="142" y="465">5弦 A2</text><text x="142" y="485">6弦 E2</text></g>
    <g fill="#fff"><rect x="228" y="407" width="24" height="26"/><rect x="408" y="387" width="24" height="26"/><rect x="588" y="387" width="24" height="26"/><rect x="768" y="367" width="24" height="26"/></g>
    <g font-size="24" text-anchor="middle"><text x="240" y="428">0</text><text x="420" y="408">1</text><text x="600" y="408">3</text><text x="780" y="388">0</text></g>
    <g font-size="18" text-anchor="middle"><text x="240" y="521">实响 G3</text><text x="420" y="521">实响 C4</text><text x="600" y="521">实响 D4</text><text x="780" y="521">实响 E4</text></g>
    <g font-size="16" text-anchor="middle"><text x="240" y="557">事件1 · 起点0</text><text x="420" y="557">事件2 · 起点1</text><text x="600" y="557">事件3 · 起点2</text><text x="780" y="557">事件4 · 起点3</text></g>
  </g>
</svg>
